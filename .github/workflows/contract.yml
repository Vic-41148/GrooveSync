name: contract

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  navidrome:
    runs-on: ubuntu-latest
    services:
      navidrome:
        image: deluan/navidrome@sha256:59ce76e6e06193fbfbb1736a93b8468227e1ea663fc7b25b1da13fbb97f5197b
        ports:
          - 4533:4533
        env:
          ND_SCANSCHEDULE: 1h
          ND_LOGLEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
      - name: Contract test
        env:
          NAVI_BASE_URL: http://127.0.0.1:4533
        run: go test -tags=contract ./server/internal/navidrome/
