name: nightly
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Property tests
        env:
          CGO_ENABLED: '0'
        run: go test ./server/internal/identity ./server/internal/taste -run 'Property|Properties' -count=1 -rapid.checks=10000
      - name: Simulation
        env:
          CGO_ENABLED: '0'
          SIMULATION_SEEDS: '10000'
        run: go test ./server/internal/simulation -count=1

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.android
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Put the SDK tools on PATH
        run: |
          {
            echo "$ANDROID_HOME/emulator"
            echo "$ANDROID_HOME/platform-tools"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
          } >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create the emulator
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd -n ci \
            -k "system-images;android-35;google_apis;x86_64"
          ls -l "$ANDROID_AVD_HOME"
      - name: Check the accelerator
        run: |
          ls -l /dev/kvm
          emulator -accel-check
      - name: Boot the emulator
        run: |
          emulator -avd ci -no-window -no-audio -no-boot-anim -no-metrics \
            -accel on -gpu swiftshader_indirect -no-snapshot \
            > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          booted=0
          for _ in $(seq 1 84); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; then
              booted=1
              break
            fi
            sleep 5
          done
          if [ "$booted" != "1" ]; then
            echo "emulator did not finish booting"
            exit 1
          fi
          adb devices
      - name: Run the connected smoke
        run: ./gradlew -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" :android:connectedDebugAndroidTest
      - name: Emulator log
        if: failure()
        run: tail -100 emulator.log
