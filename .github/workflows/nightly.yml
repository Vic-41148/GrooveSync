name: nightly
on:
  schedule:
    - cron: '0 2 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Property tests
        run: go test ./server/internal/identity ./server/internal/taste -run 'Property|Properties' -count=1 -rapid.checks=10000
      - name: Simulation
        env:
          SIMULATION_SEEDS: '10000'
        run: go test ./server/internal/simulation -count=1
