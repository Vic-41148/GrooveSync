name: nightly
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nightly.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Property tests
        env:
          CGO_ENABLED: '0'
        run: go test ./server/internal/identity ./server/internal/taste -run 'Property|Properties' -count=1 -rapid.checks=10000
      - name: Simulation
        env:
          CGO_ENABLED: '0'
          SIMULATION_SEEDS: '10000'
        run: go test ./server/internal/simulation -count=1

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Put the SDK tools on PATH
        run: |
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create the emulator
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd -n ci \
            -k "system-images;android-35;google_apis;x86_64"
      - name: Boot the emulator
        run: |
          emulator -avd ci -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot > emulator.log 2>&1 &
          adb wait-for-device
          timeout 300 bash -c \
            'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
      - name: Run the connected smoke
        run: ./gradlew :android:connectedDebugAndroidTest
      - name: Emulator log
        if: failure()
        run: tail -100 emulator.log
